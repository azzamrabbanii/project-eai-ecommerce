openapi: 3.0.0
info:
  title: E-Commerce API Documentation
  description: Combined API Documentation for Order and Product Services
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local Gateway / Server
paths:
  # --- ORDER SERVICE SECTION ---
  /api/orders:
    post:
      summary: Create a new order (Checkout)
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, product_id, quantity]
              properties:
                user_id: {type: integer, example: 1}
                product_id: {type: integer, example: 101}
                quantity: {type: integer, minimum: 1, example: 2}
      responses:
        '201': {description: Order created successfully}
        '400': {description: Insufficient stock}

  /api/orders/history/{user_id}:
    get:
      summary: Get user order history
      tags: [Orders]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200': {description: Success}

  /api/orders/{id}/status:
    put:
      summary: Update order status
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: {type: string, enum: [pending, paid, cancelled]}
      responses:
        '200': {description: Updated}

  # --- PRODUCT SERVICE SECTION ---
  /api/products:
    get:
      summary: Get all products with filters
      tags: [Products]
      parameters:
        - name: search
          in: query
          schema: {type: string}
        - name: condition
          in: query
          schema: {type: string, enum: [like_new, good, fair, poor]}
        - name: min_price
          in: query
          schema: {type: number}
        - name: max_price
          in: query
          schema: {type: number}
      responses:
        '200': {description: Success}
    post:
      summary: Create a new product
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201': {description: Created}

  /api/products/{id}:
    get:
      summary: Get product detail
      tags: [Products]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200': {description: Success}
    put:
      summary: Update a product
      tags: [Products]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200': {description: Updated}
    delete:
      summary: Delete a product
      tags: [Products]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '200': {description: Deleted}

components:
  schemas:
    Order:
      type: object
      properties:
        id: {type: integer}
        user_id: {type: integer}
        product_id: {type: integer}
        quantity: {type: integer}
        total_price: {type: number}
        status: {type: string}

    Product:
      type: object
      required: [name, price, condition, stock]
      properties:
        id: {type: integer, readOnly: true}
        name: {type: string}
        description: {type: string}
        price: {type: number}
        condition: {type: string, enum: [like_new, good, fair, poor]}
        stock: {type: integer}